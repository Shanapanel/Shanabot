<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shanabot | Anasayfa</title>
    <style>
        @font-face { font-family: 'Hemi Head'; src: url('hemi head bd it.ttf') format('truetype'); font-weight: bold; font-style: italic; }
        :root { 
            --neon-cyan: #00f2ff; --neon-pink: #e91e63; --neon-gold: #ffd700; 
            --neon-purple: #bc13fe; --neon-green: #00ff88; --neon-white: #ffffff; 
            --bg-dark: #05070a; --main-font: 'Hemi Head', sans-serif; 
        }
        body { background-color: var(--bg-dark); background-image: radial-gradient(circle at center, #0d121d 0%, #05070a 100%); color: #fff; font-family: var(--main-font); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .hub-container { text-align: center; z-index: 2; padding: 20px 0; width: 100%; display: flex; flex-direction: column; align-items: center; }
        h1 { font-size: 70px; text-shadow: 0 0 20px var(--neon-cyan); letter-spacing: 4px; margin-bottom: 40px; text-transform: uppercase; font-style: italic; }
        
        .menu-grid { display: flex; gap: 25px; justify-content: center; flex-wrap: nowrap; padding: 20px 40px; width: 100%; max-width: 1600px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
        .menu-grid::-webkit-scrollbar { display: none; }
        
        .nav-card { 
            width: 210px; height: 320px; background: rgba(255, 255, 255, 0.02); 
            border: 2px solid rgba(255, 255, 255, 0.05); border-radius: 20px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            text-decoration: none; transition: all 0.4s; position: relative; overflow: hidden; flex-shrink: 0;
        }
        .nav-card:hover { transform: translateY(-10px); }
        
        .card-pokedex { border-color: rgba(0, 242, 255, 0.15); } .card-pokedex:hover { border-color: var(--neon-cyan); box-shadow: 0 0 30px rgba(0, 242, 255, 0.2); } .card-pokedex .title { color: var(--neon-cyan); }
        .card-market { border-color: rgba(255, 215, 0, 0.15); } .card-market:hover { border-color: var(--neon-gold); box-shadow: 0 0 30px rgba(255, 215, 0, 0.2); } .card-market .title { color: var(--neon-gold); }
        .card-basarim { border-color: rgba(233, 30, 99, 0.15); } .card-basarim:hover { border-color: var(--neon-pink); box-shadow: 0 0 30px rgba(233, 30, 99, 0.2); } .card-basarim .title { color: var(--neon-pink); }
        .card-leader { border-color: rgba(255, 255, 255, 0.08); } .card-leader:hover { border-color: var(--neon-white); box-shadow: 0 0 30px rgba(255, 255, 255, 0.2); } .card-leader .title { color: var(--neon-white); }
        .card-event { border-color: rgba(0, 255, 136, 0.15); } .card-event:hover { border-color: var(--neon-green); box-shadow: 0 0 30px rgba(0, 255, 136, 0.2); } .card-event .title { color: var(--neon-green); }
        .card-faq { border-color: rgba(188, 19, 254, 0.15); } .card-faq:hover { border-color: var(--neon-purple); box-shadow: 0 0 30px rgba(188, 19, 254, 0.2); } .card-faq .title { color: var(--neon-purple); }
        .card-watchparty { border-color: rgba(233, 30, 99, 0.2); } .card-watchparty:hover { border-color: var(--neon-pink); box-shadow: 0 0 30px rgba(233, 30, 99, 0.3); } .card-watchparty .title { color: var(--neon-pink); }

        .icon { font-size: 60px; margin-bottom: 20px; }
        .title { font-size: 18px; letter-spacing: 1px; margin-bottom: 10px; font-style: italic; text-align: center; }
        .desc { font-size: 11px; font-family: 'Segoe UI', sans-serif; color: #666; padding: 0 20px; line-height: 1.4; }
        .footer { position: fixed; bottom: 15px; font-size: 11px; letter-spacing: 4px; color: #222; text-transform: uppercase; font-style: italic; }
    </style>
</head>
<body>
    <div class="hub-container">
        <h1>SHANABOT</h1>
        <div class="menu-grid" id="hub-grid"></div>
    </div>
    <div class="footer">SHANAPANEL DATA CORE // SECURE CONNECTION ESTABLISHED</div>

    <script>
        const cards = [
            { icon: "🔴", title: "POKÉDEX", color: "pokedex", link: "https://shanapanel.github.io/Shanabot/pokedex.html", desc: "Eğitmenlerin güncel koleksiyon verileri ve aktif savaş takımları." },
            { icon: "🏦", title: "MARKET", color: "market", link: "https://shanapanel.github.io/Shanabot/market.html", desc: "Sistem içi varlıklarla ticaret ve özel yetki alım terminali." },
            { icon: "🏆", title: "BAŞARIMLAR", color: "basarim", link: "https://shanapanel.github.io/Shanabot/başarım.html", desc: "Kullanıcı rütbeleri, kariyer kayıtları ve kilitli madalyalar." },
            { icon: "👑", title: "LİDERLİK", color: "leader", link: "https://shanapanel.github.io/Shanabot/leaderboard.html", desc: "Etkinlik şampiyonları, TOP 25 listesi ve Onur Kürsüsü." },
            { icon: "🎬", title: "WATCHPARTY", color: "watchparty", link: "https://shanapanel.github.io/Shanabot/watchparty.html", desc: "Yayında birlikte izlediğimiz anime, dizi ve filmlerin detaylı sezon arşiv rehberi." },
            { icon: "🎯", title: "ETKİNLİKLER", color: "event", link: "https://shanapanel.github.io/Shanabot/eventler.html", desc: "Harf Çorbası ve canlı yayın oyun protokolleri hakkında teknik rehber." },
            { icon: "🏛️", title: "ÇOKÇA SORULANLAR", color: "faq", link: "https://shanapanel.github.io/Shanabot/faq.html", desc: "Sistem protokolleri, puan kazanma yöntemleri ve av kuralları rehberi." }
        ];

        const grid = document.getElementById('hub-grid');
        cards.forEach(c => {
            grid.innerHTML += `<a href="${c.link}" target="_blank" class="nav-card card-${c.color}"><div class="icon">${c.icon}</div><div class="title">${c.title}</div><div class="desc">${c.desc}</div></a>`;
        });
    </script>
</body>
</html>
