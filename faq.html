<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shanabot | Sıkça Sorulanlar</title>
    <style>
        @font-face { font-family: 'Hemi Head'; src: url('hemi head bd it.ttf') format('truetype'); font-weight: bold; font-style: italic; }
        :root { --neon-cyan: #00f2ff; --neon-gold: #ffd700; --neon-pink: #e91e63; --neon-green: #00ff88; --neon-purple: #bc13fe; --bg-dark: #05070a; --main-font: 'Hemi Head', sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; font-family: var(--main-font); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background-image: radial-gradient(circle at center, #0d121d 0%, #05070a 100%); }
        header { text-align: center; padding: 40px 0; width: 100%; border-bottom: 2px solid var(--neon-cyan); background: rgba(0,0,0,0.5); position: relative; }
        header h1 { font-size: 55px; margin: 0; text-shadow: 0 0 20px var(--neon-cyan); letter-spacing: 3px; font-style: italic; }
        .home-link { position: absolute; top: 20px; right: 20px; text-decoration: none; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 8px 15px; border-radius: 5px; font-size: 14px; transition: 0.3s; }
        .home-link:hover { background: var(--neon-cyan); color: var(--bg-dark); box-shadow: 0 0 15px var(--neon-cyan); }
        .tab-nav { display: flex; gap: 10px; margin: 30px 0; flex-wrap: wrap; justify-content: center; }
        .tab-btn { background: #0d1117; border: 1px solid rgba(255,255,255,0.1); color: #888; padding: 12px 25px; cursor: pointer; font-family: var(--main-font); font-size: 18px; border-radius: 5px; transition: 0.3s; font-style: italic; }
        .tab-btn.active { color: var(--neon-cyan); border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); background: rgba(0, 242, 255, 0.05); }
        .content-container { width: 90%; max-width: 1100px; padding: 20px; margin-bottom: 50px; }
        .tab-content { display: none; animation: fadeIn 0.4s ease forwards; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .terminal-box { background: #0d1117; border-left: 5px solid var(--neon-cyan); padding: 25px; margin-bottom: 25px; border-radius: 4px; }
        .box-title { display: block; font-size: 24px; color: #fff; margin-bottom: 15px; letter-spacing: 1px; font-style: italic; }
        .box-text { font-family: 'Segoe UI', sans-serif; color: #aaa; line-height: 1.8; font-size: 16px; margin: 0; }
        .val-text { color: var(--neon-cyan); font-weight: bold; }
        .sub-text { color: var(--neon-pink); font-weight: bold; }
        .gold-text { color: var(--neon-gold); font-weight: bold; }
        .purple-text { color: var(--neon-purple); font-weight: bold; }
        .important { color: #ff4d4d; font-weight: bold; text-decoration: underline; display: block; margin-bottom: 10px; }
        .border-cyan { border-left-color: var(--neon-cyan); }
        .border-gold { border-left-color: var(--neon-gold); }
        .border-green { border-left-color: var(--neon-green); }
        .border-pink { border-left-color: var(--neon-pink); }
        .border-purple { border-left-color: var(--neon-purple); }
        .exit-btn { display: block; width: fit-content; margin: 20px auto; color: var(--neon-pink); border: 1px solid var(--neon-pink); padding: 10px 25px; text-decoration: none; font-style: italic; transition: 0.3s; }
        .exit-btn:hover { background: var(--neon-pink); color: #fff; box-shadow: 0 0 20px var(--neon-pink); }
        .footer { padding: 40px; color: #333; letter-spacing: 4px; font-size: 11px; font-style: italic; text-align: center; }
    </style>
</head>
<body>

    <header>
        <a href="https://shanapanel.github.io/Shanabot/" target="_blank" class="home-link">🏠 ANA SAYFA</a>
        <h1>SHANABOT ÇOKÇA SORULANLAR</h1>
    </header>

    <div class="tab-nav" id="tab-nav-container"></div>
    <div class="content-container" id="tab-content-container"></div>
    <a href="https://shanapanel.github.io/Shanabot/" target="_blank" class="exit-btn">← SİSTEMDEN ÇIKIŞ YAP</a>
    <div class="footer">SHANABOT SECURE CORE // v2.3.5 // ALL SYSTEMS OPERATIONAL</div>

    <script>
        async function loadFaq() {
            try {
                const response = await fetch('./faq.json');
                const faqData = await response.json();
                renderFaq(faqData);
            } catch(e) { console.error("faq.json yüklenemedi!"); }
        }

        function renderFaq(data) {
            const navContainer = document.getElementById('tab-nav-container');
            const contentContainer = document.getElementById('tab-content-container');
            navContainer.innerHTML = '';
            contentContainer.innerHTML = '';

            let isFirst = true;

            for (let tab in data) {
                // Sekme Butonunu Ekle
                navContainer.innerHTML += `<button class="tab-btn ${isFirst ? 'active' : ''}" onclick="openTab(event, '${tab.replace(/\s+/g, '')}')">${tab}</button>`;
                
                // Sekme İçeriğini (Kutuları) Ekle
                let tabHtml = `<div id="${tab.replace(/\s+/g, '')}" class="tab-content ${isFirst ? 'active' : ''}">`;
                
                data[tab].forEach(item => {
                    tabHtml += `
                        <div class="terminal-box ${item.color}">
                            <span class="box-title">${item.title}</span>
                            <p class="box-text">${item.content}</p>
                        </div>`;
                });
                
                tabHtml += `</div>`;
                contentContainer.innerHTML += tabHtml;
                isFirst = false;
            }
        }

        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
                tabcontent[i].classList.remove("active");
            }
            tablinks = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.className += " active";
        }
        
        loadFaq();
    </script>
</body>
</html>
